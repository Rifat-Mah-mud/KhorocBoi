name: khoroboi
description: KhorocBoi — personal expense tracker with Bangla/English/Banglish natural-language input.
publish_to: "none"
version: 1.1.2+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.5
  uuid: ^4.5.1
  intl: ^0.20.2
  fl_chart: ^0.70.2
  google_fonts: ^6.2.1
  http: ^1.3.0
  collection: ^1.19.1
  dio: ^5.8.0+1
  package_info_plus: ^8.3.0
  open_filex: ^4.7.0
  permission_handler: ^11.4.0
  path: ^1.9.1
  shared_preferences: ^2.5.5
  connectivity_plus: ^7.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/data/dictionary.json
    - assets/images/logo.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/app_icon.png
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/images/app_icon.png
  remove_alpha_ios: true
